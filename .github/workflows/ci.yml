name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the @types/node major version in app/package.json.
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          # The version recorded in _docs/local-development.md.
          deno-version: v2.9.7

      # The Edge Function env file holds secrets and must stay untracked.
      - name: No committed Edge Function env file
        run: test -z "$(git ls-files 'supabase/functions/.env' 'supabase/functions/**/.env')"

      - name: Type check
        working-directory: supabase/functions/cluster-feedback
        run: deno check .

      - name: Lint
        working-directory: supabase/functions
        run: deno lint

      # No --allow-* flag: the tests get no network, env, or file access.
      - name: Test
        working-directory: supabase/functions/cluster-feedback
        run: deno test

  database:
    name: Database (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the @types/node major version in app/package.json.
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # The version recorded in _docs/local-development.md.
          version: 2.122.0

      # Uses no repository secrets: the RLS suite reads the local default keys
      # from the running stack through its globalSetup.
      - name: Start local Supabase
        run: supabase start

      - name: RLS suite
        working-directory: app
        run: npm run test:rls

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
